<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#132d4f">
  <title>Connection unavailable | Chinga</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#122137;font:16px/1.6 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{max-width:540px}a{color:#235eac}small{font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#52677f}h1{font-size:42px;line-height:1.12;letter-spacing:-.04em;margin:18px 0}p{color:#526174}button{border:0;border-radius:99px;background:#132d4f;color:white;font:600 15px system-ui;padding:16px 26px;cursor:pointer}#local{display:none;font-size:14px}code{background:#e6edf5;padding:3px 7px;border-radius:4px}
  </style>
</head>
<body><main>
  <small>Chinga / connection</small>
  <h1>We can’t reach the app right now.</h1>
  <p>This screen needs a connection to the Chinga server. Your device may still be connected to the internet.</p>
  <p id="local">For the local demo, run <code>npm run dev</code> in the project folder and try again.</p>
  <button id="retry" type="button">Try this page again</button>
</main><script>
  if (['localhost', '127.0.0.1'].includes(location.hostname)) document.getElementById('local').style.display = 'block';
  document.getElementById('retry').addEventListener('click', () => location.reload());
  addEventListener('online', () => location.reload());
</script></body></html>
